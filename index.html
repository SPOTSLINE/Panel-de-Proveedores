<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de Proveedores Spotsline</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Misma estética que el Panel de Pagos a Proveedores: fondo negro, amarillo Spotsline, tarjetas con barra de color inferior. */
*{box-sizing:border-box}
:root{
  --bg:#0f0f0f;--bg2:#1a1a1a;--bg3:#242424;--bg4:#2e2e2e;
  --border:#333;--border2:#444;--text:#f0f0f0;--text2:#aaa;--text3:#666;
  --yellow:#f5c400;--yellow2:#ffd740;--yellow-dim:#2a2200;--yellow-dim2:#3a3000;
  --red:#e74c3c;--red-bg:#2a0f0d;--orange:#e67e22;--orange-bg:#2a1a08;
  --green:#2ecc71;--green-bg:#0a2010;--blue:#3498db;--blue-bg:#0a1e2e;
  --spl:#3498db;--spots:#a78bfa;--teal:#1abc9c;
  --radius:8px;--radius-lg:12px;
  /* alias usados por el código */
  --ink:var(--text);--muted:var(--text2);--line:var(--border);--surface:var(--bg2);--accent:var(--yellow);--accent-soft:var(--yellow-dim);--accent-ink:#000;
  --p1:var(--red);--p2:var(--orange);--p3:var(--blue);--p4:#8a8a8a;--ok:var(--green);--warn:#f39c12;
  --c1:var(--yellow);--c2:var(--orange);--c3:var(--blue);--c4:var(--spots);--c5:var(--teal);
  color-scheme:dark;
}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:14px;line-height:1.45}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:16px;font-weight:600;letter-spacing:.3px}
h2{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.6px}
h3{font-size:14px;font-weight:600}
.num,td.n,th.n{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
header{background:var(--bg2);border-bottom:1px solid var(--yellow);padding:0 24px;position:sticky;top:0;z-index:50}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;min-height:56px}
.logo{display:flex;align-items:center;gap:12px;padding:10px 0}
.logo-icon{width:34px;height:34px;background:var(--yellow);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-icon img{width:24px;height:auto;display:block}
.src{font-size:11px;color:var(--text3)}
nav{display:flex;gap:4px;background:var(--bg3);padding:4px;border-radius:var(--radius);width:fit-content;max-width:100%;overflow-x:auto;margin:0 0 12px}
nav a{padding:6px 14px;border-radius:6px;font-size:13px;color:var(--text3);text-decoration:none;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
nav a:hover{color:var(--text)}
nav a.on{background:var(--yellow);color:#000;font-weight:700}
main{padding:20px 24px 40px;display:grid;gap:18px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;display:grid;gap:12px;min-width:0;align-content:start}
.card>.row:first-child h2{display:flex;align-items:center;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:18px}
.hero{background:var(--yellow);border-radius:var(--radius-lg);padding:20px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;color:#000}
.hero-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;opacity:.6;margin-bottom:4px}
.hero-amount{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums}
.hero-sub{font-size:13px;opacity:.6;margin-top:4px}
.hero-counts{display:flex;gap:24px;flex-wrap:wrap}
.hero-count{text-align:center}
.hero-count-val{font-size:22px;font-weight:800}
.hero-count-lbl{font-size:11px;opacity:.6;font-weight:600;text-transform:uppercase}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.tile{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;position:relative;overflow:hidden;display:grid;gap:3px;border-top:1px solid var(--border)!important}
.tile::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--m-color,var(--border))}
.tile .l{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.tile .v{font-size:22px;font-weight:700;color:var(--m-color,var(--text));font-variant-numeric:tabular-nums}
.tile .s{font-size:11px;color:var(--text3)}
.muted{color:var(--text2)} .small{font-size:12px}
.tbl{overflow:auto;max-height:640px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--bg2)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--bg2);padding:10px 12px;text-align:left;font-weight:600;color:var(--text3);font-size:11px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;border-bottom:1px solid var(--border);z-index:1}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg3)}
input,select,button,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:7px 10px;font-size:13px;color:var(--text);min-width:0;height:36px}
td input,td select{height:30px;padding:4px 8px;background:var(--bg3)}
select option{background:var(--bg2)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--yellow)}
button:focus-visible,a:focus-visible{outline:2px solid var(--yellow);outline-offset:1px}
button{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;font-size:13px;white-space:nowrap;transition:all .15s}
button:hover{background:var(--bg4);color:var(--text)}
button.pri{background:var(--yellow);color:#000;border-color:var(--yellow);font-weight:600}
button.pri:hover{background:var(--yellow2);border-color:var(--yellow2)}
button.sm{padding:4px 9px;font-size:12px}
button:disabled{opacity:.45;cursor:not-allowed}
a{color:var(--yellow)}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600;white-space:nowrap}
.pill.P1{background:var(--red-bg);color:var(--red)} .pill.P2{background:var(--orange-bg);color:var(--orange)} .pill.P3{background:var(--blue-bg);color:var(--blue)} .pill.P4,.pill.PR{background:var(--bg3);color:var(--text2)}
.pill.cA{background:var(--red-bg);color:var(--red)} .pill.cB{background:var(--orange-bg);color:var(--orange)} .pill.cC{background:var(--bg3);color:var(--text2)}
.P1{color:var(--red)} .P2{color:var(--orange)} .P3{color:var(--blue)} .P4,.PR{color:var(--text2)}
.cA{color:var(--red)} .cB{color:var(--orange)} .cC{color:var(--text2)}
.ok{color:var(--green)} .bad{color:var(--red)} .warn{color:#f39c12}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:minmax(150px,240px) 1fr 120px;gap:10px;align-items:center;font-size:13px}
.bar .t{height:14px;background:var(--bg3);border-radius:4px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:4px}
.bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text2)}
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;align-items:end;height:220px;padding-top:8px;border-bottom:1px solid var(--border)}
.col{display:flex;flex-direction:column-reverse;height:100%;gap:1px}
.col i{display:block;width:100%}
.colx{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;font-size:11px;color:var(--text3);text-align:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text2)}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.empty{border:1px dashed var(--border2);border-radius:var(--radius-lg);padding:18px;color:var(--text2);display:grid;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--bg3);border-left:4px solid #f39c12;border-radius:var(--radius);padding:10px 12px;font-size:13px}
.alert.r{border-left-color:var(--red);background:linear-gradient(90deg,#3a1508,#2a1a08)}
.alert.g{border-left-color:var(--green)}
.drop{border:2px dashed var(--border2);border-radius:var(--radius-lg);padding:26px;text-align:center;display:grid;gap:8px;justify-items:center;color:var(--text2)}
.drop.over{border-color:var(--yellow);background:var(--yellow-dim)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.form label{display:grid;gap:4px;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px}
.qgroup{border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px;display:grid;gap:8px;background:var(--bg)}
.best td{background:var(--green-bg)}
.status{font-size:12px;color:var(--text3)}
.emp-SPOT{color:var(--spots)} .emp-SPL{color:var(--spl)}
.hidden{display:none!important}
.hbtn{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;padding:0;margin-left:8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border2);color:var(--text2);vertical-align:1px;text-transform:none}
.hbtn:hover{background:var(--yellow);color:#000;border-color:var(--yellow)}
.hbtn.dark{background:rgba(0,0,0,.12);border-color:rgba(0,0,0,.3);color:#000}
.mback{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-start;justify-content:center;padding:60px 16px;z-index:100}
.mback.open{display:flex}
.modal{background:var(--bg2);border-radius:var(--radius-lg);border:1px solid var(--border2);padding:22px;width:620px;max-width:96vw;max-height:84vh;overflow-y:auto;display:grid;gap:14px}
.hsec{display:grid;gap:6px;padding:12px 14px;border-radius:var(--radius);background:var(--bg3);font-size:13.5px;line-height:1.55;color:var(--text2)}
.hsec.on{border-left:4px solid var(--yellow);background:var(--yellow-dim);color:var(--text)}
.hsec h4{margin:0;font-size:13px;color:var(--text)}
.hsec p{margin:0;max-width:65ch}
@media (max-width:768px){header,main{padding-left:12px;padding-right:12px}.bar{grid-template-columns:110px 1fr 90px}.grid2{grid-template-columns:1fr}.hero-amount{font-size:30px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.ti{display:inline-block;width:1.1em;height:1.1em;background:currentColor;vertical-align:-.15em;flex-shrink:0;-webkit-mask:var(--i) center/contain no-repeat;mask:var(--i) center/contain no-repeat}
.ti-adjustments{--i:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%20class%3D%22icon%20icon-tabler%20icons-tabler-outline%20icon-tabler-adjustments%22%20%3E%20%3Cpath%20stroke%3D%22none%22%20d%3D%22M0%200h24v24H0z%22%20fill%3D%22none%22/%3E%20%3Cpath%20d%3D%22M4%2010a2%202%200%201%200%204%200a2%202%200%200%200%20-4%200%22%20/%3E%20%3Cpath%20d%3D%22M6%204v4%22%20/%3E%20%3Cpath%20d%3D%22M6%2012v8%22%20/%3E%20%3Cpath%20d%3D%22M10%2016a2%202%200%201%200%204%200a2%202%200%200%200%20-4%200%22%20/%3E%20%3Cpath%20d%3D%22M12%204v10%22%20/%3E%20%3Cpath%20d%3D%22M12%2018v2%22%20/%3E%20%3Cpath%20d%3D%22M16%207a2%202%200%201%200%204%200a2%202%200%200%200%20-4%200%22%20/%3E%20%3Cpath%20d%3D%22M18%204v1%22%20/%3E%20%3Cpath%20d%3D%22M18%209v11%22%20/%3E%20%3C/svg%3E")}

.ti-building-store{--i:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%20class%3D%22icon%20icon-tabler%20icons-tabler-outline%20icon-tabler-building-store%22%20%3E%20%3Cpath%20stroke%3D%22none%22%20d%3D%22M0%200h24v24H0z%22%20fill%3D%22none%22/%3E%20%3Cpath%20d%3D%22M3%2021l18%200%22%20/%3E%20%3Cpath%20d%3D%22M3%207v1a3%203%200%200%200%206%200v-1m0%201a3%203%200%200%200%206%200v-1m0%201a3%203%200%200%200%206%200v-1h-18l2%20-4h14l2%204%22%20/%3E%20%3Cpath%20d%3D%22M5%2021l0%20-10.15%22%20/%3E%20%3Cpath%20d%3D%22M19%2021l0%20-10.15%22%20/%3E%20%3Cpath%20d%3D%22M9%2021v-4a2%202%200%200%201%202%20-2h2a2%202%200%200%201%202%202v4%22%20/%3E%20%3C/svg%3E")}
.ti-calendar-due{--i:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%20class%3D%22icon%20icon-tabler%20icons-tabler-outline%20icon-tabler-calendar-due%22%20%3E%20%3Cpath%20stroke%3D%22none%22%20d%3D%22M0%200h24v24H0z%22%20fill%3D%22none%22/%3E%20%3Cpath%20d%3D%22M4%205m0%202a2%202%200%200%201%202%20-2h12a2%202%200%200%201%202%202v12a2%202%200%200%201%20-2%202h-12a2%202%200%200%201%20-2%20-2z%22%20/%3E%20%3Cpath%20d%3D%22M16%203v4%22%20/%3E%20%3Cpath%20d%3D%22M8%203v4%22%20/%3E%20%3Cpath%20d%3D%22M4%2011h16%22%20/%3E%20%3Cpath%20d%3D%22M12%2016m-1%200a1%201%200%201%200%202%200a1%201%200%201%200%20-2%200%22%20/%3E%20%3C/svg%3E")}

const toD = v => { if(!v) return null; if(v instanceof Date) return isNaN(v)?null:v; if(typeof v==='number') return new Date(Math.round((v-25569)*DAY)); const s=String(v).trim(); let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return new Date(+m[1],+m[2]-1,+m[3]); m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if(m) return new Date(+(m[3].length==2?'20'+m[3]:m[3]),+m[2]-1,+m[1]); const d=new Date(s); return isNaN(d)?null:d; };

function ruleCat(emp,prod){
  const m=String(prod||'').match(/^\[([^\]]+)\]/); if(!m) return null;
  const p=(m[1].match(/^[A-Za-zÑñ]+/)||[''])[0].toUpperCase();
  return (BASE.rules[emp]||{})[p]||null;
}
let SUP = new Map();
function buildSuppliers(){
  SUP = new Map();
  const add=(emp,n)=>{const k=keyOf(emp,n); if(!SUP.has(k)) SUP.set(k,{k,emp,n,baseCat:null,baseCrit:'',u:'',nu:0,oc:[],compras:0,nOc:0,ult:null}); return SUP.get(k);};
  BASE.provs.forEach(p=>{const s=add(p.emp,p.n); s.baseCat=p.cat; s.baseCrit=p.crit; s.u=p.u; s.nu=p.nu;});
  S.oc.forEach(o=>{ if(o.est==='X') return; const s=add(o.emp,o.prov); s.oc.push(o); });
  (BASE.maestro||[]).filter(m=>m.n&&!/^total$/i.test(m.n.trim())).forEach(m=>{ const n=norm(m.n); let hit=null; for(const s of SUP.values()) if(norm(s.n)===n && (!hit||s.emp==='SPOT')) hit=s;
    const targets = hit? [...SUP.values()].filter(s=>norm(s.n)===n) : [Object.assign(add('SPOT',m.n),{baseCat:m.cat,sinOc:true})];
    targets.forEach(s=>{ if(m.crit) s.baseCrit=m.crit; s.motivo=m.mot; s.maestroVal=m.val; s.plazoMaestro=m.plazo; }); });
  const desde = new Date(today.getTime()-S.f.meses*30.44*DAY);
  for(const s of SUP.values()){
    if(!s.baseCat && !s.oc.length) s.baseCat='REV';
    if(!s.baseCat){ const by={}; s.oc.forEach(o=>{const c=o.cat||ruleCat(o.emp,o.prod)||'REV'; by[c]=(by[c]||0)+o.total;}); s.baseCat=Object.entries(by).sort((a,b)=>b[1]-a[1])[0]?.[0]||'REV'; s.baseCrit=CATS[s.baseCat]?.crit||''; }
    const o=S.ov[s.k]||{};
    s.cat=o.cat||s.baseCat; s.crit=o.crit||s.baseCrit; s.validado=!!(o.cat||o.crit)||!!s.maestroVal;
    s.plazo = (o.plazo!=null && o.plazo!=='')? +o.plazo : (s.plazoMaestro ?? S.cfg.plazoDef);
    const rec = s.oc.filter(x=>x.est!=='SC' && x.fecha>=desde);
    s.compras = rec.reduce((a,x)=>a+x.total,0); s.nOc=rec.length;
    s.ult = s.oc.reduce((a,x)=>!a||x.fecha>a?x.fecha:a,null);
  }
}
function supByName(name, emp){
  const n=norm(name);
  for(const s of SUP.values()) if(norm(s.n)===n && (!emp||s.emp===emp)) return s;
  for(const s of SUP.values()) if(norm(s.n)===n) return s;
  return null;
}
const catName = k => CATS[k]?.nom || k || 'Sin clasificar';

/* ---------- prioridad ---------- */
function prioridad(crit, dias){ // dias = días al vencimiento (negativo = vencida)
  const c = crit==='A'?0:crit==='B'?1:2;
  const M = [['P1','P1','P2','P3','PR'],['P2','P2','P3','P3','PR'],['P3','P3','P4','P4','PR']];
  const col = dias < -15 ? 0 : dias < 0 ? 1 : dias <= 7 ? 2 : dias <= 30 ? 3 : 4;
  return M[c][col];
}
const PNAME = {P1:'P1',P2:'P2',P3:'P3',P4:'P4',PR:'Proyección'};

/* ---------- entregas ---------- */
let ENT = new Map(); // supKey -> stats
function buildEntregas(){
  ENT = new Map(); if(!S.rec) return;
  const ocByRef = new Map(S.oc.map(o=>[o.ref,o]));
  S.rec.forEach(r=>{
    const o = ocByRef.get(String(r.origen||'').split(/[,\s]/)[0]);
    const s = o? SUP.get(keyOf(o.emp,o.prov)) : supByName(r.contacto);
    r.sup = s; r.oc = o;
    if(!s) return;
    if(!ENT.has(s.k)) ENT.set(s.k,{n:0,aTiempo:0,atrasos:[],prom:[],real:[],pend:0,pendVenc:0});
    const e = ENT.get(s.k);
    if(r.efectiva){
      e.n++; const d = r.programada? Math.round((r.efectiva-r.programada)/DAY):null;
      if(d!=null){ if(d<=0) e.aTiempo++; e.atrasos.push(Math.max(0,d)); }
      if(o && o.fecha){ e.real.push(Math.max(0,Math.round((r.efectiva-o.fecha)/DAY))); if(r.programada) e.prom.push(Math.round((r.programada-o.fecha)/DAY)); }
    } else { e.pend++; if(r.programada && r.programada<today) e.pendVenc++; }
  });
  const med = a => { if(!a.length) return null; const b=[...a].sort((x,y)=>x-y); return b[Math.floor(b.length/2)]; };
  for(const e of ENT.values()){
    e.otd = e.atrasos.length? e.aTiempo/e.atrasos.length : null;
    e.atrasoProm = e.atrasos.length? e.atrasos.reduce((a,b)=>a+b,0)/e.atrasos.length : null;
    e.leadReal = med(e.real); e.leadProm = med(e.prom);
    const cero = e.prom.filter(x=>x<=1).length;
    e.sinLogica = e.prom.length>=3 && ( cero/e.prom.length>=0.6 || (e.leadReal!=null && e.leadProm!=null && Math.abs(e.leadReal-e.leadProm)>=10) );
  }
}

function deudaRows(){
  if(!S.mayor) return [];
  return S.mayor.map(m=>{
    const s = supByName(m.contacto, m.emp);
    const crit = s?.crit || 'C';
    const dias = m.venc? Math.round((m.venc-today)/DAY) : 0;
    return {...m, s, crit, cat:s?.cat||'REV', dias, p: m.monto>0? prioridad(crit,dias):null};
  });
}

function proyeccion(){
  const W0 = weekStart(), items=[];
  const push=(fecha,concepto,emp,s,prov,monto,detalle,p)=>{ items.push({fecha,concepto,emp,cat:s?.cat||'REV',crit:s?.crit||'',prov,monto,detalle,p:p||''}); };
  deudaRows().forEach(r=>{ if(r.monto<=0) return; push(r.venc&&r.venc<today?today:(r.venc||today), r.venc&&r.venc<today?'Vencido':'FC a vencer', r.emp, r.s, r.contacto, r.monto, r.numero, r.p); });
  const lim = new Date(today.getTime()-S.cfg.edadMax*DAY);
  S.oc.forEach(o=>{
    if(o.est!=='OC' || o.fac==='F' || !o.fecha || o.fecha<lim) return;
    const s=SUP.get(keyOf(o.emp,o.prov)); const e=s&&ENT.get(s.k);
    const lead = e?.leadReal ?? S.cfg.leadDef; const plazo = s?.plazo ?? S.cfg.plazoDef;
    let rec = new Date(o.fecha.getTime()+lead*DAY); if(rec<today) rec=new Date(today);
    const f = new Date(rec.getTime()+plazo*DAY);
    push(f, o.fac==='E'?'Recibido sin FC':'OC por recibir', o.emp, s, o.prov, o.total, o.ref+' · '+o.prod);
  });
  S.cotiz.filter(q=>q.estado==='aprobada').forEach(q=>{
    const s = supByName(q.proveedor, q.emp);
    const base = toD(q.aprobada)||today;
    const f = new Date(base.getTime()+((+q.entrega||0)+(+q.plazoPago||0))*DAY);
    const monto = (+q.monto||0)*(q.moneda==='USD'?S.cfg.tc:1);
    push(f<today?today:f,'Cotización aprobada', q.emp||'SPOT', s, q.proveedor, monto, q.necesidad);
  });
  items.forEach(it=>{ const w=Math.floor((it.fecha-W0)/(7*DAY)); it.sem = it.concepto==='Vencido'? -1 : Math.min(Math.max(w,0),8); });
  return {W0, items};
}

function openHelp(key){
  let m=document.getElementById('helpModal');
  if(!m){ m=el(`<div id="helpModal" class="mback" role="dialog" aria-modal="true" aria-labelledby="helpTitle"><div class="modal"><div class="row" style="justify-content:space-between"><h3 id="helpTitle"><i class="ti ti-help-circle"></i> Ayuda</h3><button id="helpClose" class="sm" aria-label="Cerrar ayuda">✕</button></div><div id="helpBody"></div></div></div>`);
    document.body.append(m); m.addEventListener('click',e=>{ if(e.target===m) m.classList.remove('open'); }); m.querySelector('#helpClose').addEventListener('click',()=>m.classList.remove('open'));
    document.addEventListener('keydown',e=>{ if(e.key==='Escape') m.classList.remove('open'); }); }
  const tab = key? HELP[key]?.tab : current;
  const keys = Object.keys(HELP).filter(k=>HELP[k].tab===tab);
  const first = key || keys[0];
  const ordered = [first, ...keys.filter(k=>k!==first)];
  m.querySelector('#helpBody').innerHTML = ordered.map((k,i)=>`<div class="hsec ${i===0?'on':''}"><h4>${esc(k)}</h4><p>${HELP[k].t}</p></div>`).join('') +
    `<div class="hsec"><h4>Otras pestañas</h4><p>${Object.entries(TABHELP).filter(([t])=>t!==tab).map(([t,k])=>`<a href="#${t}" data-h="${esc(k)}">${esc(document.querySelector('#nav a[href="#'+t+'"]').textContent.trim())}</a>`).join(' · ')}</p></div>`;
  m.querySelectorAll('a[data-h]').forEach(a=>a.addEventListener('click',e=>{ e.preventDefault(); openHelp(a.dataset.h); }));
  m.classList.add('open'); m.querySelector('#helpClose').focus();
}

/* ---------- historial ---------- */
const TIPOS={proveedor:'Proveedor',decision:'Pago Sí / No',cotizacion:'Cotización',config:'Supuestos',datos:'Carga de datos'};
async function logChange(tipo, objeto, campo, antes, despues){
  if(!S.db||!S.uid) return;
  const v=x=>x==null||x===''?'—':String(x);
  if(v(antes)===v(despues)) return;
  try{
    if(!S.histReg){ await S.db.doc('historial/'+S.uid).set({uid:S.uid}); S.histReg=true; }
    await S.db.collection(`historial/${S.uid}/items`).add({ts:new Date().toISOString(), uid:S.uid, tipo, objeto:String(objeto).slice(0,200), campo, antes:v(antes).slice(0,200), despues:v(despues).slice(0,200)});
  }catch(e){}
}
async function saveOv(k, patch){
  const s=SUP.get(k); const prevS={cat:s.cat,crit:s.crit,plazo:S.ov[k]?.plazo??''}; const cur={...(S.ov[k]||{}), ...patch, emp:s.emp, n:s.n};
  if(!cur.cat) cur.cat=s.cat; if(!cur.crit) cur.crit=s.crit;
  S.ov[k]=cur;
  if(S.db){ try{ await S.db.doc('proveedores/'+k).set(cur);
    if('cat' in patch) logChange('proveedor',s.n,'Categoría',catName(prevS.cat),catName(cur.cat));
    if('crit' in patch) logChange('proveedor',s.n,'Criticidad',prevS.crit,cur.crit);
    if('plazo' in patch) logChange('proveedor',s.n,'Plazo de pago (días)',prevS.plazo,cur.plazo);
  }catch(e){ handleWriteErr(e); } }
  render();
}
function handleWriteErr(e){ if(e?.code==='invalid_argument'){ S.canWrite=false; } toast(e?.code==='quota_exceeded'?'No se pudo guardar: se llenó el espacio del panel.':'No se pudo guardar el cambio. Revisá tu permiso sobre el panel.'); }
function toast(msg){ let t=document.getElementById('toast'); if(!t){ t=el('<div id="toast" role="status" style="position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;z-index:9;font-size:14px"></div>'); document.body.append(t);} t.textContent=msg; t.classList.remove('hidden'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.add('hidden'),4000); }

    <div class="hero-sub">${delDia.length} facturas marcadas Sí${caja?` · caja disponible ${$m(caja)} · ${totDia>caja?'<b>excede la caja en '+$m(totDia-caja)+'</b>':'queda '+$m(caja-totDia)}`:''}</div></div>
    <div class="hero-counts">${['P1','P2','P3','P4'].map(p=>`<div class="hero-count"><div class="hero-count-val">${$M(byP[p])}</div><div class="hero-count-lbl">${p}</div></div>`).join('')}

    ${list.map(r=>{ const si=r.d?.pagar==='si', no=r.d?.pagar==='no'; if(si&&r.d.fecha===dia) acum+=r.monto;

  const agg={}; fc.forEach(r=>{ const a=agg[r.cat]=agg[r.cat]||{t:0,si:0,n:0}; const c=colOf(r); a[c]=(a[c]||0)+r.monto; a.t+=r.monto; a.n++; if(r.d?.pagar==='si') a.si+=r.monto; });
  const catRows=Object.entries(agg).sort((a,b)=>b[1].t-a[1].t);

async function saveDec(r, d, silent){
  const k=r.k; const prev=S.dec[k];
  const txt=x=>x?(x.pagar==='si'?'Sí · '+dfmt(toD(x.fecha)):'No'):'Sin decidir';
  if(d){ d={...d, emp:r.emp, proveedor:r.contacto, numero:r.numero, monto:Math.round(r.monto), prioridad:r.p, decidido:iso(today)}; S.dec[k]=d; } else delete S.dec[k];
  if(S.db){ try{ d? await S.db.doc('decisiones/'+k).set(d) : await S.db.doc('decisiones/'+k).delete(); logChange('decision', r.contacto+' · '+r.numero+' · '+$m(r.monto), '¿Pagar?', txt(prev), txt(d)); }catch(e){ handleWriteErr(e); } }

}

   <div class="tbl"><table><thead><tr><th>Reporte</th><th>Dónde se exporta en Odoo</th><th>Campos</th><th>Estado</th></tr></thead><tbody>
   <tr><td>Órdenes de compra</td><td>Compras › Órdenes de compra (filtro: últimos 12-18 meses)</td><td class="small">Empresa, Referencia de la orden, Fecha límite de la orden o Fecha de confirmación, Proveedor, Producto, Total, Estado, Estado de facturación, Comprador</td><td>${S.ocMeta.base?'<span class="ok">Base del 12/11/2026</span> · '+S.ocMeta.filas+' OC':st(S.ocMeta)}</td></tr>
   <tr><td>Recepciones</td><td>Inventario › Recepciones (incluir las hechas)</td><td class="small">Referencia, Documento origen, Contacto, Fecha programada, Fecha efectiva, Estado</td><td>${st(S.recMeta,'Sin cargar')}</td></tr>
   <tr><td>Órdenes de pago</td><td>Contabilidad › Proveedores › Pagos (u Órdenes de pago), últimos 60 días</td><td class="small">Número, Contacto, Empresa, Fecha de pago, Importe, Estado, Diario o Método de pago</td><td>${st(S.pagosMeta,'Sin cargar')}</td></tr>
   <tr><td>Mayor de proveedores</td><td>Contabilidad › Apuntes contables: cuenta a pagar, publicado, no conciliado</td><td class="small">Contacto, Empresa, Número, Fecha de la factura, Fecha de vencimiento, Importe residual</td><td>${st(S.mayorMeta,'Sin cargar')}</td></tr>
   </tbody></table></div>`)));
  app.append(el(card('<i class="ti ti-adjustments"></i>'+'Supuestos de la proyección', `<div class="form">
   <label>Plazo de pago por defecto (días)<input id="c_plazoDef" type="number" min="0" value="${S.cfg.plazoDef}" ${ro?'disabled':''}></label>
   <label>Plazo de entrega por defecto (días)<input id="c_leadDef" type="number" min="0" value="${S.cfg.leadDef}" ${ro?'disabled':''}></label>
   <label>OC abiertas: antigüedad máxima (días)<input id="c_edadMax" type="number" min="1" value="${S.cfg.edadMax}" ${ro?'disabled':''}></label>
   <label>Tipo de cambio para cotizaciones en USD<input id="c_tc" type="number" min="0" step="any" value="${S.cfg.tc}" ${ro?'disabled':''}></label></div>
   <p class="small muted" style="margin:0">El plazo por defecto se usa para los proveedores sin plazo propio cargado en Proveedores. Lo ideal es que el plazo salga del término de pago de la ficha en Odoo.</p>`)));
  ['plazoDef','leadDef','edadMax','tc'].forEach(k=>{ const i=document.getElementById('c_'+k); i.addEventListener('change',()=>saveCfg({[k]:+i.value})); });
  const drop=document.getElementById('drop'), file=document.getElementById('file');
  file.addEventListener('change',()=>file.files[0]&&ingest(file.files[0]));
  drop.addEventListener('dragover',e=>{e.preventDefault(); drop.classList.add('over');});
  drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
  drop.addEventListener('drop',e=>{e.preventDefault(); drop.classList.remove('over'); if(!ro&&S.db&&e.dataTransfer.files[0]) ingest(e.dataTransfer.files[0]);});
}
const CFGN={plazoDef:'Plazo de pago por defecto',leadDef:'Plazo de entrega por defecto',edadMax:'Antigüedad máxima de OC',tc:'Tipo de cambio',caja:'Caja disponible'};
async function saveCfg(p){ Object.entries(p).forEach(([k,v])=>logChange('config','Supuestos',CFGN[k]||k,S.cfg[k],v)); S.cfg={...S.cfg,...p}; if(S.db){ try{ await S.db.doc('config/general').set(S.cfg);}catch(e){handleWriteErr(e);} } render(); }

/* ---------- carga de Excel ---------- */
function pick(h, ...needles){ return h.find(x=>needles.some(n=>x.toLowerCase().includes(n))); }
async function ingest(f){
  const msg=document.getElementById('upMsg'); msg.textContent='Leyendo '+f.name+'…';
  try{
    if(typeof XLSX==='undefined') throw new Error('No cargó el lector de Excel. Recargá la página.');
    const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:null,raw:true});
    if(!rows.length) throw new Error('La hoja está vacía.');
    const h=Object.keys(rows[0]); let type, out;
    if(pick(h,'residual')){
      type='mayor'; const c={con:pick(h,'contacto','socio','proveedor'), emp:h.find(x=>/^empresa/i.test(x)), num:pick(h,'número','numero','asiento'), ff:pick(h,'fecha de la factura','fecha'), fv:pick(h,'vencimiento'), res:pick(h,'residual')};
      let data=rows.filter(r=>r[c.con]&&r[c.res]!=null).map(r=>[String(r[c.con]).trim(),empOf(r[c.emp]),String(r[c.num]||''),iso(toD(r[c.ff])),iso(toD(r[c.fv])),+r[c.res]||0]);
      const s=data.reduce((a,r)=>a+r[5],0); if(s<0) data=data.map(r=>{r[5]=-r[5]; return r;});
      out=data;
    } else if(pick(h,'programad')){
      type='rec'; const c={ref:pick(h,'referencia'), ori:pick(h,'origen'), con:pick(h,'contacto','proveedor','socio'), pro:pick(h,'programad'), efe:pick(h,'efectiv','realizad','hecho'), est:pick(h,'estado'), lim:pick(h,'límite','limite')};
      out=rows.filter(r=>r[c.ref]).map(r=>[String(r[c.ref]),String(r[c.ori]||''),String(r[c.con]||''),iso(toD(r[c.pro])),iso(toD(r[c.efe])),String(r[c.est]||''),iso(toD(r[c.lim]))]);
    } else if(/pago/i.test(f.name) || pick(h,'importe pagado','método de pago','metodo de pago','fecha de pago','diario')){
      type='pagos'; const c={num:pick(h,'número','numero','nombre','referencia'), con:pick(h,'contacto','socio','proveedor','partner'), emp:h.find(x=>/^empresa/i.test(x)), fe:pick(h,'fecha de pago','fecha'), imp:pick(h,'importe pagado','importe','monto','total'), est:pick(h,'estado'), met:pick(h,'método','metodo','diario')};
      if(!c.con||!c.imp) throw new Error('El archivo de pagos tiene que traer al menos Contacto (o Proveedor) e Importe.');
      out=rows.filter(r=>r[c.con]&&r[c.imp]!=null&&!/cancel|borrador|draft/i.test(String(r[c.est]||''))).map(r=>[String(r[c.num]||''),String(r[c.con]).trim(),empOf(r[c.emp]),iso(toD(r[c.fe])),Math.abs(+r[c.imp]||0),String(r[c.est]||''),String(r[c.met]||'')]);
    } else if(pick(h,'referencia de la orden') || (pick(h,'proveedor')&&pick(h,'total'))){
      type='oc'; const c={emp:h.find(x=>/^empresa/i.test(x)), ref:pick(h,'referencia de la orden','referencia'), fe:pick(h,'confirmación','confirmacion','fecha límite de la orden','fecha de la orden','fecha'), pr:pick(h,'proveedor'), prod:pick(h,'producto'), tot:pick(h,'total'), est:h.find(x=>/^estado$/i.test(x)), fac:pick(h,'facturación','facturacion'), comp:pick(h,'comprador')};
      const st=s=>/cancel/i.test(s)?'X':/solicitud|cotiz|borrador/i.test(s)?'SC':'OC'; const fa=s=>/totalmente/i.test(s)?'F':/espera|facturar$/i.test(s)&&!/nada/i.test(s)?'E':'N';
      out=rows.filter(r=>r[c.ref]&&r[c.pr]).map(r=>{ const emp=empOf(r[c.emp]); const prod=String(r[c.prod]||'').replace(/\n/g,' '); return [emp,String(r[c.ref]),iso(toD(r[c.fe])),String(r[c.pr]).trim(),prod,+r[c.tot]||0,st(String(r[c.est]||'')),fa(String(r[c.fac]||'')),String(r[c.comp]||''),ruleCat(emp,prod)]; }).filter(r=>r[6]!=='X');
    } else throw new Error('No reconozco el archivo. Tiene que traer las columnas de Órdenes de compra, Recepciones (Fecha programada), Mayor (Importe residual) u Órdenes de pago (Importe y Fecha de pago).');
    msg.textContent=`Guardando ${out.length} filas de ${TNAME[type]}…`;
    const CH=700, n=Math.ceil(out.length/CH);
    const prev=await S.db.doc('datasets/'+type).get(); const prevN=prev.exists?(prev.data().chunks||0):0;
    for(let i=0;i<n;i++) await S.db.doc(`datasets/${type}/chunks/c${i}`).set({rows:out.slice(i*CH,(i+1)*CH)});
    for(let i=n;i<prevN;i++) await S.db.doc(`datasets/${type}/chunks/c${i}`).delete();
    const meta={chunks:n, filas:out.length, cargado:iso(today), archivo:f.name};
    await S.db.doc('datasets/'+type).set(meta);
    logChange('datos', TNAME[type], 'Archivo cargado', S[type+'Meta']?.archivo||'', f.name+' ('+out.length+' filas)');
    applyDataset(type, meta, out); msg.textContent='Listo: '+out.length+' filas cargadas.'; render();
  }catch(e){ msg.textContent= e.code? 'No se pudo guardar: '+(e.code==='quota_exceeded'?'se llenó el espacio del panel.':'revisá tu permiso sobre el panel.') : e.message; }
}
const TNAME={oc:'órdenes de compra',rec:'recepciones',mayor:'mayor de proveedores',pagos:'órdenes de pago'};
function applyDataset(type, meta, rows){
  if(type==='pagos'){ S.pagos=rows.map(r=>({numero:r[0],contacto:r[1],emp:r[2],fecha:toD(r[3]),monto:+r[4]||0,estado:r[5],metodo:r[6]})); S.pagosMeta=meta; }
  if(type==='oc'){ S.oc=ocFromArrays(rows); S.ocMeta={...meta,base:false}; }
  if(type==='rec'){ S.rec=rows.map(r=>({ref:r[0],origen:r[1],contacto:r[2],programada:toD(r[3]),efectiva:/cancel/i.test(r[5])?null:toD(r[4]),estado:r[5],limite:toD(r[6])})).filter(r=>!/cancel/i.test(r.estado)); S.recMeta=meta; }
  if(type==='mayor'){ S.mayor=rows.map(r=>({contacto:r[0],emp:r[1],numero:r[2],ffc:toD(r[3]),venc:toD(r[4]),monto:r[5]})); S.mayorMeta=meta; }
}

/* ---------- arranque ---------- */
window.addEventListener('hashchange',route);
document.getElementById('bHelp').addEventListener('click',()=>openHelp(TABHELP[current]));
route();
(async()=>{
  let db=null; try{ db=await use('db'); }catch(e){}
  if(!db){ S.dbState='sin-db'; S.canWrite=false; render(); return; }
  S.db=db;
  try{ const u=await use('user'); S.user=u; if(u){ S.uid=await u.id(); const w=await u.can('data.write'); if(w===false) S.canWrite=false; } }catch(e){}
  const histSubs={};
  db.collection('historial').onSnapshot(s=>{ s.docs.forEach(d=>{ const uid=d.id; if(histSubs[uid]) return;
    histSubs[uid]=db.collection(`historial/${uid}/items`).orderBy('ts','desc').limit(400).onSnapshot(q=>{ S.hist[uid]=q.docs.map(x=>x.data()); if(current==='historial') render(); },()=>{}); }); },()=>{});
  const timer=setTimeout(()=>{ if(S.dbState==='cargando'){ toast('Los datos guardados todavía no llegan; se muestran los datos base.'); } },10000);
  db.collection('proveedores').onSnapshot(s=>{ S.ov={}; s.docs.forEach(d=>S.ov[d.id]=d.data()); clearTimeout(timer); S.dbState='ok'; render(); },()=>{});
  db.collection('decisiones').onSnapshot(s=>{ S.dec={}; s.docs.forEach(d=>S.dec[d.id]=d.data()); render(); },()=>{});
  db.collection('cotizaciones').onSnapshot(s=>{ S.cotiz=s.docs.map(d=>({id:d.id,...d.data()})); render(); },()=>{});
  db.doc('config/general').onSnapshot(d=>{ if(d.exists){ S.cfg={...S.cfg,...d.data()}; render(); } },()=>{});
  for(const t of ['oc','rec','mayor','pagos']){
    try{ const m=await db.doc('datasets/'+t).get(); if(!m.exists) continue; const meta=m.data(); let rows=[];
      for(let i=0;i<(meta.chunks||0);i++){ const c=await db.doc(`datasets/${t}/chunks/c${i}`).get(); if(c.exists) rows=rows.concat(c.data().rows||[]); }
      applyDataset(t,meta,rows); render(); }catch(e){}
  }
})();
</script>
